name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/explore-business-niches-L5uHc]   # ← change to main/master when you merge
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel any in-progress run on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          # Paste your Google Apps Script web-app URL as a GitHub secret:
          #   Repo → Settings → Secrets → Actions → New repository secret
          NEXT_PUBLIC_SHEETS_URL: ${{ secrets.NEXT_PUBLIC_SHEETS_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out   # Next.js static export writes here

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
